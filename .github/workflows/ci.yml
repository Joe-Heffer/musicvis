name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Ruff
        run: uvx ruff check tools
      - name: Syntax check
        run: python3 -m compileall -q tools

  data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JSON validity
        run: |
          for f in docs/sections.json docs/one-fuzz/sections.json video/meta.json video-one-fuzz/meta.json video/hyperframes.json video-one-fuzz/hyperframes.json; do
            [ -f "$f" ] || { echo "skip $f"; continue; }
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: audio-data.js parses
        run: |
          for d in video video-one-fuzz; do
            [ -f "$d/audio-data.js" ] || { echo "skip $d"; continue; }
            node --check "$d/audio-data.js" && echo "ok $d/audio-data.js"
          done

  hyperframes:
    name: HyperFrames lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [video, video-one-fuzz]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Track audio is gitignored; stub silent WAVs so the lint can resolve <audio src>.
      - name: Stub gitignored audio
        if: hashFiles(format('{0}/index.html', matrix.project)) != ''
        working-directory: ${{ matrix.project }}
        run: |
          grep -oE '<audio[^>]*src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)"/\1/' | while read -r f; do
            [ -f "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            python3 -c "import sys,wave; w=wave.open(sys.argv[1],'wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b'\0'*4*44100); w.close()" "$f"
            echo "stubbed $f"
          done
      - name: Lint composition
        if: hashFiles(format('{0}/index.html', matrix.project)) != ''
        working-directory: ${{ matrix.project }}
        run: npx --yes hyperframes@0.9.30 lint
