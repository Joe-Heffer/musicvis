[project]
name = "musicvis"
version = "0.1.0"
description = "Audio analysis for scripted music visualisers"
requires-python = ">=3.10,<3.13"
dependencies = ["librosa>=0.10", "numpy", "soundfile", "demucs"]


[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "video", "video-one-fuzz"]

[tool.ruff.lint]
# Correctness only (pyflakes + syntax errors); the data builders use a dense style on purpose.
select = ["E9", "F"]
