<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="audio-data.js"></script>
    <style>
      :root {
        --ground: #0a0b0f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; background: var(--ground); }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="169.92" data-width="1920" data-height="1080">
      <canvas id="gl" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <audio id="track" src="assets/glitch-metal.wav" data-start="0" data-duration="169.92" data-track-index="1"></audio>
    </div>

    <script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime;      // seconds (may be tape-stop remapped)
uniform float uSeed;      // changes only on new displayed frames
uniform float uKick, uSnare, uGlitch, uSub, uRiff, uSynth, uEcho;
uniform float uIntro, uVerse, uPre, uChorus, uBreak, uFinal;
uniform float uBright, uCrush, uCA, uFlash, uPump;
uniform float uBar;        // fractional bar position
uniform float uBeat16;     // sixteenth-note counter (integer-valued)
uniform vec2  uShake;
uniform float uRibGain, uRibFlick;
uniform float uShardDx;   // guitar-pan drift of the shard lattice (scene units)
uniform float uWidth;     // mix stereo width 0..1: scales the channel split
uniform float uRib[64];
uniform float uRibE[64];
out vec4 outColor;

// ---- palette (docs/BRIEF.md) ----
const vec3 BG      = vec3(0.0392, 0.0431, 0.0588); // #0A0B0F
const vec3 STEEL_D = vec3(0.1647, 0.1804, 0.2196); // #2A2E38
const vec3 STEEL_L = vec3(0.5412, 0.5765, 0.6392); // #8A93A3
const vec3 FLASH   = vec3(0.9569, 0.9647, 0.9804); // #F4F6FA
const vec3 MAGENTA = vec3(1.0, 0.1804, 0.5765);    // #FF2E93
const vec3 CYAN    = vec3(0.0980, 0.8902, 1.0);    // #19E3FF
const vec3 VIOLET  = vec3(0.4784, 0.2353, 1.0);    // #7A3CFF

float hash11(float p){ p = fract(p*.1031); p *= p+33.33; p *= p+p; return fract(p); }
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

float lineGrid(vec2 q, float w){
  vec2 f = abs(fract(q) - 0.5);
  vec2 d = 0.5 - f;           // distance to nearest line in cell units
  float m = min(d.x, d.y);
  return 1.0 - smoothstep(w, w + 0.04, m);
}

// Scene luminance 0..1+ (0 = bg, ~.35 dark steel, ~.7 light steel, 1 flash)
float scene(vec2 p){
  float asp = uRes.x / uRes.y;
  float epoch = floor(uBar / 4.0);
  float ph = fract(uBar / 4.0);
  float L = 0.0;

  // kick pulse breathes the whole field
  p *= 1.0 - 0.025 * uKick - 0.02 * uPump;

  // ---- grid: flat in verses, tunnel in chorus ----
  float frag = pow(sin(3.14159 * smoothstep(0.55, 1.0, ph)), 2.0) * (1.0 - uChorus);
  vec2 blk = floor((p + vec2(asp, 1.0)) / 0.34);
  float bh = hash21(blk + epoch * 7.7);
  vec2 off = (vec2(hash21(blk + 3.1 + epoch), hash21(blk + 9.7 + epoch)) - 0.5) * 0.22 * frag;
  float drop = step(1.0 - 0.45 * frag, bh);                  // bit-crushed drop-out blocks
  vec2 pg = p - off;
  float gFlat = lineGrid(pg / 0.055, 0.035 + 0.05 * uKick);
  gFlat *= 1.0 - drop;
  gFlat += drop * step(0.5, hash21(floor(pg * 40.0) + uSeed)) * 0.25; // low-res dropout noise

  float r = length(p) + 0.001;
  vec2 tq = vec2(atan(p.y, p.x) / 6.28318 * 28.0, 0.30 / r + uTime * 1.2);
  float tun = lineGrid(tq, 0.03 + 0.05 * uKick) * smoothstep(0.02, 0.35, r) * exp(-r * 0.9);
  float gridAmt = (1.0 - uIntro) * (1.0 - 0.55 * uPre);
  float grid = mix(gFlat, tun * 1.4, uChorus) * gridAmt;
  L += grid * (0.30 + 0.16 * uKick + 0.1 * uSub) * (1.0 - 0.4 * uChorus);

  // ---- shards: angular triangles appearing on riff syncopation ----
  float sh = 0.0;
  for (int k = 0; k < 2; k++) {
    float sc = k == 0 ? 0.42 : 0.27;
    vec2 q = (p + vec2(uShardDx, 0.0)) / sc + float(k) * 3.7;
    vec2 id = floor(q);
    vec2 c = fract(q) - 0.5;
    float hh = hash21(id + float(k) * 11.0);
    float on = step(hh, uRiff * 0.9) * step(0.35, hash21(id + uBeat16 * 1.7 + float(k)));
    c = rot(hh * 6.2832) * c;
    float d = max(abs(c.x) * 0.866 + c.y * 0.5, -c.y * 0.5 - 0.02) - 0.2;
    float fill = 1.0 - smoothstep(0.0, 0.012, d);
    float edge = 1.0 - smoothstep(0.0, 0.012, abs(d) - mix(0.006, 0.0025, uPre));
    float thin = mix(fill * 0.55 + edge, edge, uPre);
    sh = max(sh, on * thin);
  }
  L = max(L, sh * (0.6 - 0.2 * uChorus) * (1.0 - uIntro) * (1.0 - 0.7 * uChorus));
  return L;
}

vec3 ramp(float L){
  vec3 c = mix(BG, STEEL_D, smoothstep(0.0, 0.35, L));
  c = mix(c, STEEL_L, smoothstep(0.3, 0.8, L));
  return mix(c, FLASH, smoothstep(0.85, 1.4, L));
}

float ribAt(float x, bool echo){
  float f = clamp(x, 0.0, 1.0) * 63.0;
  int i = int(floor(f));
  int j = min(i + 1, 63);
  float a = smoothstep(0.0, 1.0, fract(f));
  return mix(uRib[i], uRib[j], a);
}
float ribE(float x){
  float f = clamp(x, 0.0, 1.0) * 63.0;
  int i = int(floor(f)); int j = min(i + 1, 63);
  return mix(uRibE[i], uRibE[j], fract(f));
}

void main(){
  vec2 frag = gl_FragCoord.xy / uRes;
  frag.y = 1.0 - frag.y;
  float asp = uRes.x / uRes.y;
  vec2 uv = frag;

  // ---- glitch transforms of the *scene only* (ribbon uses clean uv) ----
  vec2 g = uv + uShake;
  float band = floor(g.y * 22.0 + uSeed * 3.0);
  float bandOn = step(0.55, hash11(band * 1.37 + uSeed)) * step(0.02, uGlitch);
  g.x += (hash11(band + uSeed * 0.31) - 0.5) * 0.18 * uGlitch * bandOn;      // slice displacement
  float smearBlk = step(1.0 - 0.16 * uGlitch, hash21(floor(g * vec2(6.0, 14.0)) + uSeed)); // datamosh smear
  g.x = mix(g.x, floor(g.x * 6.0) / 6.0 + 0.001, smearBlk * 0.8);
  // pixel-sort style streaks in the break
  if (uBreak > 0.01) {
    float rowH = hash11(floor(g.y * 90.0) + floor(uSeed * 0.5));
    float start = floor(g.x * 6.0 + rowH * 3.0) / 6.0;
    float t = clamp((g.x - start) * 6.0, 0.0, 1.0);
    float sx = start + pow(t, 1.0 + 2.5 * rowH) / 6.0;
    g.x = mix(g.x, sx, uBreak * 0.85);
  }
  // bit-crush (resolution drop)
  vec2 cres = mix(uRes, vec2(176.0, 99.0), uCrush);
  g = (floor(g * cres) + 0.5) / cres;

  vec2 p = (g - 0.5) * vec2(asp, 1.0);
  vec2 ca = vec2(uCA * 0.006 * (0.7 + 0.6 * uWidth), 0.0);
  float L0 = scene(p);
  vec3 col = ramp(L0);
  if (uCA > 0.002) {
    float Lc = scene(p + ca);
    float Lm = scene(p - ca);
    float verseOnly = 1.0 - uChorus;                       // verses: cyan fringes only
    col += CYAN * max(Lc - L0, 0.0) * 0.9;
    col += MAGENTA * max(Lm - L0, 0.0) * 0.9 * (1.0 - 0.9 * verseOnly);
  }

  // background: sub swell + chorus violet gradient
  float vig = 1.0 - smoothstep(0.2, 1.1, length((uv - 0.5) * vec2(asp, 1.0)));
  col += STEEL_D * 0.35 * uSub * vig * (1.0 - uIntro);
  col += VIOLET * 0.30 * uChorus * pow(vig, 1.5) * (0.7 + 0.5 * uFinal);

  // ---- ribbon: clean, never glitched ----
  vec2 pc = (uv - 0.5) * vec2(asp, 1.0);
  pc /= 1.0 - 0.02 * uPump;
  float rx = uv.x;
  float yc = (ribAt(rx, false) - 0.5) * 0.62 - 0.02 + 0.20 * uBreak;   // break: higher in frame
  float yE = (ribAt(rx - 0.012, true) - 0.5) * 0.62 - 0.02 + 0.20 * uBreak - 0.015;
  float e = ribE(rx);
  float th = (0.004 + 0.007 * uChorus + 0.003 * uFinal) * (0.6 + 0.8 * e);
  float d = abs(pc.y - yc);
  float core = exp(-pow(d / th, 2.0));
  float glow = exp(-d / (0.03 + 0.07 * uChorus + 0.03 * uFinal)) * (0.18 + 0.5 * uChorus + 0.25 * uFinal);
  float thin = mix(1.0, 0.5, uPre);
  float rg = uRibGain * uRibFlick * mix(0.35 + 0.65 * e, 1.0, uChorus) * thin;
  vec3 ribCol = mix(MAGENTA, CYAN, uBreak);                 // break: single cyan line
  // chorus gradient along the ribbon: magenta -> violet -> cyan
  vec3 grad = mix(mix(MAGENTA, VIOLET, smoothstep(0.0, 0.5, rx)), CYAN, smoothstep(0.5, 1.0, rx));
  ribCol = mix(ribCol, grad, uChorus * (1.0 - uBreak));
  col += ribCol * (core * 1.1 + glow * e) * rg;
  col += FLASH * pow(core, 3.0) * 0.55 * rg;                // hot centre
  // cyan echo from the clean guitar
  float dE = abs(pc.y - yE);
  col += CYAN * exp(-pow(dE / (th * 1.8), 2.0)) * 0.35 * uEcho * (0.3 + 0.7 * uChorus) * (1.0 - uBreak) * uRibGain;

  // ---- colour management per section ----
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  float sat = 1.0 - 0.75 * uPre;
  float monoBreak = uBreak;
  vec3 grey = vec3(lum);
  vec3 keep = col;
  col = mix(grey, keep, sat);
  // break is monochrome except the cyan line
  vec3 lineOnly = ramp(L0) + CYAN * (core * 1.1 + glow * e) * rg;
  col = mix(col, lineOnly, monoBreak);

  // letterbox: narrow frame in verses, opens fully in chorus
  float open = max(max(uChorus, uIntro), uBreak * 0.5);
  float halfW = mix(0.36, 0.5, open);
  float inside = smoothstep(halfW + 0.002, halfW - 0.002, abs(uv.x - 0.5));
  float border = smoothstep(0.004, 0.0, abs(abs(uv.x - 0.5) - halfW)) * (1.0 - open) * (1.0 - uIntro);
  col = col * inside + STEEL_D * 0.7 * border;
  // intro lives in the open frame
  col = mix(col, col / max(inside, 1e-3) * step(0.0, 1.0), 0.0);

  // flashes, pump, brightness, tail
  col += FLASH * uFlash;
  col *= 1.0 - 0.22 * uPump * uChorus;
  col *= uBright;
  outColor = vec4(col, 1.0);
}
    </script>

    <script>
      (function () {
        var A = window.AUDIO;
        var W = 1920, H = 1080;
        var canvas = document.getElementById("gl");
        var gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
        function sh(type, src) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
          return s;
        }
        var vs = sh(gl.VERTEX_SHADER, "#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}");
        var fs = sh(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent.replace(/^\s+/, ""));
        var prog = gl.createProgram();
        gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
        gl.useProgram(prog);
        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(prog, "a");
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        var U = {};
        function u(n) { return U[n] || (U[n] = gl.getUniformLocation(prog, n)); }

        var CH = A.ch, N = A.n;
        function c(name, f) { f = Math.max(0, Math.min(N - 1, f)); return CH[name][f] / 255; }
        function sgn(name, f) { return (CH[name][Math.max(0, Math.min(N - 1, f))] - 128) / 127; }

        var rib = new Float32Array(64), ribE = new Float32Array(64);
        function draw(t) {
          var f = Math.max(0, Math.min(N - 1, Math.round(t * A.fps)));
          var s = A.src[f];                         // displayed (possibly held) source frame
          gl.viewport(0, 0, W, H);
          gl.uniform2f(u("uRes"), W, H);
          gl.uniform1f(u("uTime"), A.tm[f] / 1000);
          gl.uniform1f(u("uSeed"), s % 997);
          gl.uniform1f(u("uKick"), c("kick", s));
          gl.uniform1f(u("uSnare"), c("snare", s));
          gl.uniform1f(u("uGlitch"), c("glitch", s));
          gl.uniform1f(u("uSub"), c("sub", s));
          gl.uniform1f(u("uRiff"), c("riff", s));
          gl.uniform1f(u("uSynth"), c("synth", s));
          gl.uniform1f(u("uEcho"), c("echo", f));
          gl.uniform1f(u("uIntro"), c("intro", f));
          gl.uniform1f(u("uVerse"), c("verse", f));
          gl.uniform1f(u("uPre"), c("pre", f));
          gl.uniform1f(u("uChorus"), c("chorus", f));
          gl.uniform1f(u("uBreak"), c("brk", f));
          gl.uniform1f(u("uFinal"), c("fin", f));
          gl.uniform1f(u("uBright"), c("bright", f));
          gl.uniform1f(u("uCrush"), c("crush", s));
          gl.uniform1f(u("uCA"), c("ca", s));
          gl.uniform1f(u("uFlash"), c("flash", s));
          gl.uniform1f(u("uPump"), c("pump", f));
          gl.uniform1f(u("uBar"), A.bar[s] / 100);
          gl.uniform1f(u("uBeat16"), A.b16[s]);
          gl.uniform2f(u("uShake"), sgn("shx", s) * 0.012, sgn("shy", s) * 0.012);
          gl.uniform1f(u("uRibGain"), c("rib", f));
          gl.uniform1f(u("uRibFlick"), c("flick", f));
          gl.uniform1f(u("uShardDx"), A.sdx[s] / 1000);
          gl.uniform1f(u("uWidth"), c("wid", s));
          for (var i = 0; i < 64; i++) {
            var fi = f + Math.round((i / 63 - 0.7) * 120);
            rib[i] = c("pitch", fi);
            ribE[i] = c("synth", fi);
          }
          gl.uniform1fv(u("uRib[0]"), rib);
          gl.uniform1fv(u("uRibE[0]"), ribE);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        var state = { t: 0 };
        var tl = gsap.timeline({ paused: true });
        tl.to(state, { t: 169.92, duration: 169.92, ease: "none", onUpdate: function () { draw(state.t); } }, 0);
        window.__timelines["main"] = tl;
        draw(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
